{% extends "base.html" %}

{% block title %}Register — Entorhino{% endblock %}

{% block head %}
<style>
    .register-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: radial-gradient(circle at bottom right, var(--accent), transparent 600px);
    }
    
    .register-box {
        width: 100%;
        max-width: 420px;
        padding: 48px;
        text-align: center;
    }
    
    h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
    }
    
    p {
        color: var(--light-400);
        margin-bottom: 40px;
        font-size: 16px;
    }
    
    input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 14px 18px;
        border-radius: 12px;
        color: white;
        margin-bottom: 16px;
        font-family: inherit;
        transition: border-color 0.3s;
    }
    
    input:focus {
        outline: none;
        border-color: var(--accent);
    }
    
    .register-btn {
        width: 100%;
        justify-content: center;
        margin-top: 16px;
        background: linear-gradient(135deg, var(--accent), var(--primary));
    }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <div class="glass-panel register-box animate-fade-in">
        <h1 class="text-gradient" style="background: linear-gradient(135deg, var(--accent), var(--primary)); -webkit-background-clip: text;">Join Entorhino</h1>
        <p>Unlock your AI-driven performance tracking.</p>
        
        <form id="register-form">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email address" required>
            <input type="password" placeholder="Create Password" required>
            <button type="submit" class="btn-primary register-btn">
                <span>Create Account</span>
            </button>
        </form>
        
        <div style="margin-top: 24px; font-size: 14px; color: var(--light-400);">
            Already an elite? <a href="/" style="color: var(--accent); font-weight: 600; text-decoration: none;">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
