{% extends "base.html" %}

{% block title %}Login — Entorhino{% endblock %}

{% block head %}
<!-- Google Sign-In SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
    .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: radial-gradient(circle at top right, var(--primary), transparent 400px), 
                    radial-gradient(circle at bottom left, var(--secondary), transparent 400px);
    }
    
    .login-box {
        width: 100%;
        max-width: 420px;
        padding: 48px;
        text-align: center;
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .logo-wrapper {
        margin-bottom: 32px;
        display: flex;
        justify-content: center;
    }
    
    .logo-badge {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 800;
        box-shadow: var(--glow-purple);
    }
    
    h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
    }
    
    p {
        color: var(--light-400);
        margin-bottom: 40px;
        font-size: 16px;
    }
    
    .google-btn-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
    }
    
    .divider {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 24px 0;
        color: var(--light-400);
    }
    
    .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
    }
    
    input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 14px 18px;
        border-radius: 12px;
        color: white;
        margin-bottom: 16px;
        font-family: inherit;
        transition: border-color 0.3s;
    }
    
    input:focus {
        outline: none;
        border-color: var(--primary);
    }
    
    .login-btn {
        width: 100%;
        justify-content: center;
        margin-top: 16px;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="glass-panel login-box animate-fade-in">
        <div class="logo-wrapper">
            <div class="logo-badge">E</div>
        </div>
        
        <h1 class="text-gradient">Welcome back</h1>
        <p>Your performance. Amplified by AI.</p>
        
        <!-- Google Sign-In Integration -->
        <div class="google-btn-wrapper">
            <div id="g_id_onload"
                 data-client_id="{{ config.GOOGLE_CLIENT_ID or 'DUMMY_ID' }}"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
        
        <div class="divider">or continue with email</div>
        
        <form id="login-form">
            <input type="email" placeholder="Email address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn-primary login-btn">
                <span>Sign in to Dashboard</span>
            </button>
        </form>
        
        <div style="margin-top: 24px; font-size: 14px; color: var(--light-400);">
            Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 600; text-decoration: none;">Join the elite</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function handleCredentialResponse(response) {
        console.log("Encoded JWT ID token: " + response.credential);
        // Implement Google Auth backend verification call here
        // Example: 
        // fetch('/api/auth/google', { method: 'POST', body: JSON.stringify({token: response.credential}) })
    }
    
    document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        // Conventional login logic
    });
</script>
{% endblock %}
