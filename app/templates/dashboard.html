<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Entorhino</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🎓 Entorhino</h2>
                <div class="user-info" id="userInfo"></div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div style="padding:12px;border-top:1px solid var(--gray-700)">
                <a class="nav-item" onclick="logout()">🚪 Logout</a>
            </div>
        </aside>

        <!-- Main -->
        <main class="main-content">
            <div class="top-bar">
                <div class="flex items-center gap-2">
                    <button class="hamburger" onclick="toggleSidebar()">☰</button>
                    <h1 id="pageTitle">Dashboard</h1>
                </div>
                <div class="top-bar-actions" id="topActions"></div>
            </div>
            <div id="content"></div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        if (!requireAuth()) { }
        const user = getUser();
        if (!user) { window.location.href = '/'; }

        // ── Parent guard: must link a student before accessing dashboard ──
        if (user.role === 'parent') {
            (async () => {
                try {
                    const res = await apiGet('/users/parent/has-links');
                    if (!res.has_links) {
                        showToast('Please link your ward first', 'info');
                        setTimeout(() => { window.location.href = '/onboarding'; }, 800);
                    }
                } catch (e) { }
            })();
        }

        document.getElementById('userInfo').innerHTML = `${user.full_name}<br><span style="color:var(--gray-500);text-transform:capitalize">${user.role}</span>`;

        // Build nav based on role
        const navItems = {
            admin: [
                { id: 'home', icon: '📊', label: 'Overview' },
                { id: 'classes', icon: '🏫', label: 'Classes & Sections' },
                { id: 'subjects', icon: '📚', label: 'Subjects' },
                { id: 'teachers', icon: '👩‍🏫', label: 'Teachers' },
                { id: 'students', icon: '👨‍🎓', label: 'Students' },
                { id: 'parents-admin', icon: '👪', label: 'Parents' },
                { id: 'requests', icon: '📋', label: 'Join Requests' },
                { id: 'attendance-mgmt', icon: '📋', label: 'Attendance' },
                { id: 'admin-feedback', icon: '💬', label: 'Feedback' },
                { id: 'announcements', icon: '📢', label: 'Announcements' },
                { id: 'leaderboard', icon: '🏆', label: 'Leaderboard' },
                { id: 'gap-analysis', icon: '📊', label: 'Gap Analysis' },
                { id: 'school-admins', icon: '🛡️', label: 'School Admins' },
                { id: 'server-logs', icon: '📜', label: 'Server Logs' },
                { id: 'ai-settings', icon: '⚙️', label: 'System Config' },
            ],
            teacher: [
                { id: 'home', icon: '📊', label: 'Overview' },
                { id: 'topics', icon: '📝', label: 'Topics / Notes' },
                { id: 'tests', icon: '🧪', label: 'Tests' },
                { id: 'homework-mgmt', icon: '📚', label: 'Homework' },
                { id: 'attendance-mgmt', icon: '📋', label: 'Attendance' },
                { id: 'class-insights', icon: '📈', label: 'Class Insights' },
                { id: 'requests', icon: '📋', label: 'Join Requests' },
                { id: 'announcements', icon: '📢', label: 'Announcements' },
                { id: 'my-feedback', icon: '💬', label: 'My Feedback' },
                { id: 'leaderboard', icon: '🏆', label: 'Leaderboard' },
                { id: 'gap-analysis', icon: '📊', label: 'Gap Analysis' },
                { id: 'alerts', icon: '🚨', label: 'Alerts' },
            ],
            student: [
                { id: 'home', icon: '📊', label: 'My Performance' },
                { id: 'tests', icon: '🧪', label: 'Tests' },
                { id: 'homework-student', icon: '📚', label: 'Homework' },
                { id: 'my-attendance', icon: '📋', label: 'Attendance' },
                { id: 'learn-ai', icon: '🤖', label: 'Learn with AI' },
                { id: 'announcements', icon: '📢', label: 'Announcements' },
                { id: 'feedback', icon: '💬', label: 'Give Feedback' },
                { id: 'leaderboard', icon: '🏆', label: 'Leaderboard' },
                { id: 'gap-analysis', icon: '📊', label: 'Gap Analysis' },
                { id: 'alerts', icon: '🚨', label: 'Alerts' },
            ],
            parent: [
                { id: 'home', icon: '📊', label: 'Children Overview' },
                { id: 'child-attendance', icon: '📋', label: 'Attendance' },
                { id: 'child-details', icon: '📝', label: 'Ward Details' },
                { id: 'announcements', icon: '📢', label: 'Announcements' },
                { id: 'leaderboard', icon: '🏆', label: 'Leaderboard' },
                { id: 'gap-analysis', icon: '📊', label: 'Gap Analysis' },
                { id: 'alerts', icon: '🚨', label: 'Alerts' },
            ],
            school_admin: [
                { id: 'home', icon: '📊', label: 'Overview' },
                { id: 'classes', icon: '🏫', label: 'Classes & Sections' },
                { id: 'subjects', icon: '📚', label: 'Subjects' },
                { id: 'teachers', icon: '👩‍🏫', label: 'Teachers' },
                { id: 'students', icon: '👨‍🎓', label: 'Students' },
                { id: 'parents-admin', icon: '👪', label: 'Parents' },
                { id: 'requests', icon: '📋', label: 'Join Requests' },
                { id: 'attendance-mgmt', icon: '📋', label: 'Attendance' },
                { id: 'admin-feedback', icon: '💬', label: 'Feedback' },
                { id: 'announcements', icon: '📢', label: 'Announcements' },
                { id: 'leaderboard', icon: '🏆', label: 'Leaderboard' },
                { id: 'gap-analysis', icon: '📊', label: 'Gap Analysis' },
                { id: 'alerts', icon: '🚨', label: 'Alerts' },
            ],
        };

        const nav = document.getElementById('sidebarNav');
        (navItems[user.role] || []).forEach(item => {
            const el = document.createElement('a');
            el.className = 'nav-item';
            el.innerHTML = `${item.icon} ${item.label}${(item.id === 'alerts' || item.id === 'announcements') ? ` <span id="badge-${item.id}" style="display:none;background:var(--danger);color:white;border-radius:50%;font-size:10px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;margin-left:4px"></span>` : ''}`;
            el.onclick = () => loadPage(item.id);
            el.id = `nav-${item.id}`;
            nav.appendChild(el);
        });
        // Fetch unread alert count (lightweight endpoint)
        async function updateAlertBadge() {
            try {
                const data = await apiGet('/alerts/unread-count');
                const badge = document.getElementById('badge-alerts');
                if (badge) { badge.style.display = data.unread_count > 0 ? 'inline-flex' : 'none'; badge.textContent = data.unread_count; }
            } catch (e) { }
        }
        async function updateAnnouncementBadge() {
            try {
                const data = await apiGet('/announcements/unread-count');
                const badge = document.getElementById('badge-announcements');
                if (badge) { badge.style.display = data.unread_count > 0 ? 'inline-flex' : 'none'; badge.textContent = data.unread_count; }
            } catch (e) { }
        }
        updateAlertBadge(); updateAnnouncementBadge();

        // ── Web Push + Service Worker Registration ─────────────────
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').then(async (reg) => {
                // If permission already granted, subscribe immediately
                if ('Notification' in window && Notification.permission === 'granted' && 'PushManager' in window) {
                    try {
                        const vapidResp = await apiGet('/push/vapid-public-key');
                        const vapidKey = vapidResp.public_key;
                        const padding = '='.repeat((4 - vapidKey.length % 4) % 4);
                        const base64 = (vapidKey + padding).replace(/-/g, '+').replace(/_/g, '/');
                        const raw = atob(base64);
                        const appServerKey = new Uint8Array(raw.length);
                        for (let i = 0; i < raw.length; i++) appServerKey[i] = raw.charCodeAt(i);

                        const sub = await reg.pushManager.subscribe({
                            userVisibleOnly: true,
                            applicationServerKey: appServerKey,
                        });
                        const subJSON = sub.toJSON();
                        await apiPost('/push/subscribe', {
                            endpoint: subJSON.endpoint,
                            keys: subJSON.keys,
                        });
                    } catch (e) { console.log('[Push] Subscription failed:', e); }
                } else if ('Notification' in window && Notification.permission === 'default') {
                    // Show a notification banner that the user can click (user gesture required)
                    const banner = document.createElement('div');
                    banner.id = 'notifBanner';
                    banner.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9998;background:linear-gradient(135deg,var(--primary),var(--accent));color:white;padding:16px 20px;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.2);cursor:pointer;max-width:360px;animation:slideUp 0.4s ease;display:flex;align-items:center;gap:12px;font-size:14px';
                    banner.innerHTML = `<span style="font-size:24px">🔔</span><div><strong>Enable Notifications</strong><br><span style="opacity:0.9;font-size:12px">Get alerts for homework, tests & announcements</span></div><button style="background:rgba(255,255,255,0.2);border:none;color:white;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:18px;margin-left:8px" onclick="event.stopPropagation();document.getElementById('notifBanner')?.remove()">✕</button>`;
                    banner.onclick = async () => {
                        banner.remove();
                        const permission = await Notification.requestPermission();
                        if (permission === 'granted') {
                            try {
                                const vapidResp = await apiGet('/push/vapid-public-key');
                                const vapidKey = vapidResp.public_key;
                                const padding = '='.repeat((4 - vapidKey.length % 4) % 4);
                                const base64 = (vapidKey + padding).replace(/-/g, '+').replace(/_/g, '/');
                                const raw = atob(base64);
                                const appServerKey = new Uint8Array(raw.length);
                                for (let i = 0; i < raw.length; i++) appServerKey[i] = raw.charCodeAt(i);
                                const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: appServerKey });
                                const subJSON = sub.toJSON();
                                await apiPost('/push/subscribe', { endpoint: subJSON.endpoint, keys: subJSON.keys });
                                showToast('Notifications enabled! ✅', 'success');
                            } catch (e) { console.log('[Push] Sub failed:', e); }
                        }
                    };
                    // Show after a short delay so it doesn't feel jarring
                    setTimeout(() => document.body.appendChild(banner), 2000);
                }
            }).catch(e => console.log('[SW] Registration failed:', e));
        }

        (function connectWS() {
            const auth = JSON.parse(localStorage.getItem('entorhino_auth') || '{}');
            const token = auth.access_token;
            if (!token) return;

            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws/notifications?token=${token}`);
            let reconnectDelay = 1000;

            ws.onopen = () => { reconnectDelay = 1000; };

            ws.onmessage = (evt) => {
                if (evt.data === 'ping') { ws.send('pong'); return; }
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.type === 'announcement') {
                        updateAnnouncementBadge();
                        // Show browser notification
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification('📢 ' + msg.title, {
                                body: msg.content?.substring(0, 100) + (msg.content?.length > 100 ? '...' : ''),
                                tag: 'announcement-' + Date.now(),
                                icon: '🎓',
                            });
                        }
                        showToast(`📢 ${msg.title}`, 'info');
                    } else if (msg.type === 'alert') {
                        updateAlertBadge();
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification('🚨 Alert', {
                                body: msg.message?.substring(0, 100),
                                tag: 'alert-' + Date.now(),
                            });
                        }
                        showToast(`🚨 ${msg.message}`, 'warning');
                    }
                } catch (e) { }
            };

            ws.onclose = () => {
                setTimeout(() => { connectWS(); reconnectDelay = Math.min(reconnectDelay * 2, 30000); }, reconnectDelay);
            };

            ws.onerror = () => { ws.close(); };

            window._notifWs = ws;
        })();

        let currentPage = '';
        window._activeTest = false; // Track if a test is in progress

        // Prevent browser tab close/refresh during test
        window.addEventListener('beforeunload', (e) => {
            if (window._activeTest) {
                e.preventDefault();
                e.returnValue = 'You have an active test. Your progress will be lost if you leave.';
                return e.returnValue;
            }
        });

        function loadPage(page) {
            // Guard: warn if leaving during an active test (including same page = tests tab click during interview)
            if (window._activeTest && (page !== currentPage || window._viActive)) {
                // Show custom modal
                const overlay = document.createElement('div');
                overlay.id = 'testLeaveModal';
                overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s ease';
                overlay.innerHTML = `<div style="background:white;border-radius:16px;padding:28px 32px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
                    <h3 style="margin:0 0 12px;color:var(--danger)">⚠️ Test in Progress</h3>
                    <p style="color:var(--gray-600);font-size:14px;margin-bottom:20px">You have an active test. If you leave, your progress will be lost and you'll need to retake the test.</p>
                    <div style="display:flex;gap:10px;flex-wrap:wrap">
                        <button class="btn" style="background:var(--accent);color:white;border:none;flex:1" onclick="submitAndLeave('${page}')">✓ Submit & Leave</button>
                        <button class="btn" style="background:var(--danger);color:white;border:none;flex:1" onclick="forceLeave('${page}')">🚪 Leave (Lose Progress)</button>
                        <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('testLeaveModal').remove()">Stay</button>
                    </div>
                </div>`;
                document.body.appendChild(overlay);
                return;
            }

            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-${page}`)?.classList.add('active');
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) sidebar.classList.remove('open');

            const fn = pages[page];
            if (fn) fn();
            else document.getElementById('content').innerHTML = '<div class="empty-state"><p>Page not found</p></div>';
        }

        // Submit whatever test results we have, then navigate
        window.submitAndLeave = async (targetPage) => {
            document.getElementById('testLeaveModal')?.remove();
            try {
                // Cleanup voice interview if active
                if (window._viWs && window._viWs.readyState === WebSocket.OPEN) {
                    window._viWs.send(JSON.stringify({ type: 'end_test' }));
                    await new Promise(r => setTimeout(r, 2000));
                }
                // Submit current results
                if (window._testState && window._testState.testId) {
                    await finishAITest();
                }
            } catch (e) { console.error('Submit on leave:', e); }
            cleanupVoiceInterview();
            window._activeTest = false;
            window._testState = null;
            loadPage(targetPage);
        };

        // Force leave without saving
        window.forceLeave = (targetPage) => {
            document.getElementById('testLeaveModal')?.remove();
            if (window._viWs) { try { window._viWs.close(); } catch (e) { } }
            cleanupVoiceInterview();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            window._activeTest = false;
            window._testState = null;
            loadPage(targetPage);
        };

        // ════════════════════════════════════════════════════════════
        // PAGE RENDERERS
        // ════════════════════════════════════════════════════════════
        const pages = {};
        const C = id => document.getElementById('content');

        // ── Admin / Teacher Overview ─────────────────────────────
        pages.home = async () => {
            const title = document.getElementById('pageTitle');
            if (user.role === 'admin' || user.role === 'school_admin') { title.textContent = 'Admin Dashboard'; await adminHome(); }
            else if (user.role === 'teacher') { title.textContent = 'Teacher Dashboard'; await teacherHome(); }
            else if (user.role === 'student') { title.textContent = 'My Performance'; await studentHome(); }
            else if (user.role === 'parent') { title.textContent = 'Children Overview'; await parentHome(); }
        };

        async function adminHome() {
            try {
                const [usersRes, classes] = await Promise.all([apiGet('/admin/users?limit=100'), apiGet('/admin/classes')]);
                const users = usersRes.items || usersRes;
                const students = users.filter(u => u.role === 'student');
                const teachers = users.filter(u => u.role === 'teacher');
                C().innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value">${users.length}</div></div>
        <div class="stat-card success"><div class="stat-label">Students</div><div class="stat-value">${students.length}</div></div>
        <div class="stat-card info"><div class="stat-label">Teachers</div><div class="stat-value">${teachers.length}</div></div>
        <div class="stat-card warning"><div class="stat-label">Classes</div><div class="stat-value">${classes.length}</div></div>
      </div>
      <div class="card"><div class="card-header"><h3>Recent Users</h3></div>
      <div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>
      ${users.slice(0, 10).map(u => `<tr><td>${u.full_name}</td><td>${u.email}</td><td style="text-transform:capitalize">${u.role}</td>
      <td><span class="badge-status ${u.is_approved ? 'badge-approved' : 'badge-pending'}">${u.is_approved ? 'Approved' : 'Pending'}</span></td></tr>`).join('')}
      </tbody></table></div></div>`;
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function teacherHome() {
            C().innerHTML = `<div class="stats-grid">
    <div class="stat-card" onclick="loadPage('topics')" style="cursor:pointer"><div class="stat-label">Topics</div><div class="stat-value">📝</div><div class="stat-sub">Upload & manage</div></div>
    <div class="stat-card success" onclick="loadPage('tests')" style="cursor:pointer"><div class="stat-label">Tests</div><div class="stat-value">🧪</div><div class="stat-sub">Create & review</div></div>
    <div class="stat-card info" onclick="loadPage('homework-mgmt')" style="cursor:pointer"><div class="stat-label">Homework</div><div class="stat-value">📚</div><div class="stat-sub">Assign & check</div></div>
    <div class="stat-card warning" onclick="loadPage('attendance-mgmt')" style="cursor:pointer"><div class="stat-label">Attendance</div><div class="stat-value">📋</div><div class="stat-sub">Mark today</div></div>
  </div>`;
        }

        async function studentHome() {
            try {
                const data = await apiGet(`/analytics/student/${user.id}`);
                C().innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Average Score</div><div class="stat-value">${data.average_score}%</div></div>
        <div class="stat-card success"><div class="stat-label">Tests Taken</div><div class="stat-value">${data.total_tests_taken}</div></div>
        <div class="stat-card info"><div class="stat-label">Attendance</div><div class="stat-value">${data.attendance_rate}%</div></div>
        <div class="stat-card warning"><div class="stat-label">Homework Avg</div><div class="stat-value">${data.homework_average}%</div></div>
      </div>
      <div class="card"><div class="card-header"><h3>Recent Tests</h3></div>
      ${data.recent_tests.length ? `<div class="table-wrapper"><table><thead><tr><th>Test</th><th>Mode</th><th>Score</th><th>Date</th></tr></thead><tbody>
      ${data.recent_tests.map(t => `<tr><td>${t.test_title}</td><td><span class="badge-status badge-active" style="font-size:11px">${t.mode === 'voice' ? '🎤' : '⌨️'}</span></td><td><strong>${t.score}%</strong></td><td>${formatDate(t.taken_at)}</td></tr>`).join('')}
      </tbody></table></div>`: '<div class="empty-state"><p>No tests taken yet</p></div>'}
      </div>`;
            } catch (e) { C().innerHTML = '<div class="alert-banner warning">⚠️ ' + e.message + '</div>'; }
        }

        async function parentHome() {
            try {
                const children = await apiGet('/analytics/my-children');
                C().innerHTML = children.length ? children.map(c => `
      <div class="card">
        <div class="card-header"><h3>${c.name}</h3><span class="text-sm text-muted">${c.email}</span></div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-label">Average</div><div class="stat-value">${c.average_score}%</div></div>
          <div class="stat-card success"><div class="stat-label">Attendance</div><div class="stat-value">${c.attendance_rate}%</div></div>
          <div class="stat-card info"><div class="stat-label">Tests</div><div class="stat-value">${c.total_tests_taken}</div></div>
        </div>
      </div>`).join('') : '<div class="empty-state"><p>No linked children. Go to onboarding to link.</p></div>';
            } catch (e) { showToast(e.message, 'error'); }
        }

        // ── Classes & Sections (Admin) ───────────────────────────
        pages.classes = async () => {
            document.getElementById('pageTitle').textContent = 'Classes & Sections';
            try {
                const classes = await apiGet('/admin/classes');
                C().innerHTML = `
      <div class="card">
        <div class="card-header"><h3>Classes</h3><button class="btn btn-primary btn-sm" onclick="showAddClass()">+ Add Class</button></div>
        <div id="addClassForm" class="hidden mb-3">
          <div class="flex gap-2"><input type="text" id="newClassName" placeholder="e.g. 10th" style="flex:1;padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:8px">
          <button class="btn btn-success btn-sm" onclick="addClass()">Create</button></div>
        </div>
        ${classes.map(c => `
          <div class="card" style="padding:14px;margin-bottom:8px">
            <div class="flex justify-between items-center mb-2">
              <strong>${c.name}</strong>
              <div class="flex gap-2">
                <button class="btn btn-outline btn-sm" onclick="showAddSection('${c.id}','${c.name}')">+ Section</button>
                <button class="btn btn-danger btn-sm" onclick="deleteClass('${c.id}')">×</button>
              </div>
            </div>
            <div class="flex gap-2" style="flex-wrap:wrap">
              ${c.sections.map(s => `<span class="badge-status badge-active">${s.name} <span onclick="deleteSection('${s.id}')" style="cursor:pointer;margin-left:4px">×</span></span>`).join('')}
              ${c.sections.length === 0 ? '<span class="text-sm text-muted">No sections yet</span>' : ''}
            </div>
          </div>`).join('')}
      </div>
      <div class="modal-overlay" id="sectionModal">
        <div class="modal"><h2>Add Section to <span id="sectionClassName"></span></h2>
        <div class="form-group"><label>Section Name</label><input type="text" id="newSectionName" placeholder="e.g. A"></div>
        <input type="hidden" id="sectionClassId">
        <div class="flex gap-2"><button class="btn btn-success" onclick="addSection()">Create</button><button class="btn btn-ghost" onclick="closeSectionModal()">Cancel</button></div>
        </div></div>`;
            } catch (e) { showToast(e.message, 'error'); }
        };
        window.showAddClass = () => document.getElementById('addClassForm').classList.toggle('hidden');

                }
            }
            const subjSel = document.getElementById(`${prefix}Subject`) || document.getElementById(`hwSubject`);

            try {

                const chapters = await apiGet(`/topics/chapters?${params}`);

        // ── AI Conversation Test (Student) ────────────────────────

            } catch (e) { showToast(e.message, 'error'); }

        window.beginTest = (testId, title, totalQ, chosenMode) => {
            window._activeTest = true;

            if (chosenMode === 'voice') {

            const modeLabel = '⌨️ Text Mode';
            C().innerHTML = `<div class="card"><h2 class="mb-3">🧪 ${title} <span class="badge-status badge-active" style="font-size:12px;vertical-align:middle;margin-left:8px">${modeLabel}</span></h2>
    <p class="text-sm text-muted mb-3">AI will ask you ${totalQ} questions one by one. Type your answers.</p>
    <div id="aiTestArea"><div class="empty-state"><p>Loading first question...</p></div></div></div>`;
            askNextQuestion();
        };

        // ── Inject pulse animation CSS ──
        if (!document.getElementById('interviewCSS')) {
            const css = document.createElement('style');
            css.id = 'interviewCSS';
            css.textContent = `
                @keyframes micPulse { 0%{box-shadow:0 0 0 0 rgba(16,185,129,.4)} 70%{box-shadow:0 0 0 18px rgba(16,185,129,0)} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)} }
                @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
                @keyframes waveAnim { 0%,100%{height:8px} 50%{height:28px} }

        // ── Gemini Live Voice Interview (Real-Time PCM16 Streaming) ──────────
        function beginVoiceInterview(testId, title, totalQ) {
            const auth = JSON.parse(localStorage.getItem('entorhino_auth') || '{}');
            const token = auth.access_token;
            if (!token) { showToast('Not authenticated', 'error'); return; }

            // Track that voice interview is active (for page-leave warning)
            window._viActive = true;

            C().innerHTML = `<div class="card" style="max-width:700px;margin:0 auto">
    <h2 class="mb-3" style="text-align:center">🧪 ${title} <span class="badge-status badge-active" style="font-size:12px;vertical-align:middle;margin-left:8px">🎤 Voice Interview</span></h2>
    <div style="text-align:center;padding:20px 0">
      <div id="viWave" class="voice-wave" style="margin:0 auto 16px"><span></span><span></span><span></span><span></span><span></span></div>
      <div id="viStatus" style="font-size:16px;font-weight:600;color:var(--primary);margin-bottom:8px">Connecting...</div>
    </div>
    <div id="viConversation" style="max-height:400px;overflow-y:auto;margin-bottom:16px;padding:0 8px"></div>
    <div style="text-align:center">
      <button class="btn btn-outline btn-sm" id="viEndBtn" onclick="showLeaveInterviewDialog()" style="font-size:12px;opacity:0.7">End Interview</button>
    </div>
  </div>
  <!-- Page-leave warning overlay -->
  <div id="viLeaveDialog" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:none;align-items:center;justify-content:center">
    <div style="background:white;border-radius:16px;padding:28px 32px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
      <h3 style="margin:0 0 12px;font-size:18px">⚠️ Leave Interview?</h3>
      <p style="color:var(--gray-600);font-size:14px;line-height:1.5;margin-bottom:20px">If you leave now, your current progress will be lost and you'll need to retake the test later.</p>
      <div style="display:flex;gap:10px;flex-direction:column">
        <button class="btn btn-primary" onclick="submitCurrentProgress()" style="width:100%;padding:12px;font-size:14px">✅ Submit Current Progress</button>
        <button class="btn btn-outline" onclick="exitWithoutSaving()" style="width:100%;padding:12px;font-size:14px;border-color:#ef4444;color:#ef4444">🚪 Exit Without Saving</button>
        <button class="btn btn-outline btn-sm" onclick="hideLeaveDialog()" style="width:100%;padding:10px;font-size:13px">← Continue Interview</button>
      </div>
    </div>
  </div>`;

            let _viDoneReceived = false;

            // ── beforeunload handler ──
            const beforeUnloadHandler = (e) => {
                if (window._viActive && !_viDoneReceived) {
                    e.preventDefault();
                    e.returnValue = 'Your interview is in progress. If you leave, your progress will be lost.';
                    return e.returnValue;
                }
            };
            window._viBeforeUnload = beforeUnloadHandler;
            window.addEventListener('beforeunload', beforeUnloadHandler);

            // ── Leave dialog functions ──
            window.showLeaveInterviewDialog = () => {
                const dlg = document.getElementById('viLeaveDialog');
                if (dlg) dlg.style.display = 'flex';
            };
            window.hideLeaveDialog = () => {
                const dlg = document.getElementById('viLeaveDialog');
                if (dlg) dlg.style.display = 'none';
            };
            window.submitCurrentProgress = () => {
                window.hideLeaveDialog();
                // Send end_test to server — it will evaluate what we have so far
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'end_test' }));
                    stopMic();
                    setStatus('⏳ Submitting your progress and evaluating...');
                    setWave('idle');
                    const endBtn = document.getElementById('viEndBtn');
                    if (endBtn) { endBtn.disabled = true; endBtn.textContent = '⏳ Evaluating...'; }
                    window._viEndTimeout = setTimeout(() => {
                        cleanupVoiceInterview();
                        window._activeTest = false;
                        if (window._testState && window._testState.testId) finishAITest();
                    }, 30000);
                } else {
                    cleanupVoiceInterview();
                    window._activeTest = false;
                    finishAITest();
                }
            };
            window.exitWithoutSaving = () => {
                window.hideLeaveDialog();
                if (ws && ws.readyState === WebSocket.OPEN) ws.close();
                stopMic(); stopPlayback();
                cleanupVoiceInterview();
                window._activeTest = false;
                window._testState = null;
                showToast('Interview exited. You can retake the test later.', 'info');
                loadPage('tests');
            };

            // ── PCM16 Audio Playback via AudioContext ──
            let playCtx = null;
            let pcmQueue = [];
            let isScheduling = false;
            let nextPlayTime = 0;
            const PLAYBACK_RATE = 24000; // Gemini outputs 24kHz PCM16

            function getPlayCtx() {
                if (!playCtx) playCtx = new AudioContext({ sampleRate: PLAYBACK_RATE });
                return playCtx;
            }

            function schedulePcmChunk(float32) {
                const ctx = getPlayCtx();
                const buf = ctx.createBuffer(1, float32.length, PLAYBACK_RATE);
                buf.copyToChannel(float32, 0);
                const src = ctx.createBufferSource();
                src.buffer = buf;
                src.connect(ctx.destination);
                const now = ctx.currentTime;
                if (nextPlayTime < now) nextPlayTime = now;
                src.start(nextPlayTime);
                nextPlayTime += buf.duration;
            }

            function drainPcmQueue() {
                if (isScheduling) return;
                isScheduling = true;
                while (pcmQueue.length > 0) {
                    schedulePcmChunk(pcmQueue.shift());
                }
                isScheduling = false;
            }

            function stopPlayback() {
                pcmQueue = [];
                nextPlayTime = 0;
                if (playCtx) { try { playCtx.close(); } catch (e) { } playCtx = null; }
            }

            // Convert base64-encoded PCM16 to Float32Array
            function b64ToFloat32(b64) {
                const raw = atob(b64);
                const bytes = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
                const int16 = new Int16Array(bytes.buffer);
                const float32 = new Float32Array(int16.length);
                for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;
                return float32;
            }

            // ── Conversation log ──
            function addMsg(role, text) {
                const c = document.getElementById('viConversation'); if (!c) return;
                const d = document.createElement('div');
                d.style.cssText = `margin-bottom:10px;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;max-width:85%;${role === 'assistant' ? 'background:#e8f0fe;margin-right:auto;' : 'background:var(--gray-100);margin-left:auto;text-align:right;'}`;
                d.innerHTML = `<strong>${role === 'assistant' ? '🤖' : '🎤'}</strong> ${text}`;
                c.appendChild(d); c.scrollTop = c.scrollHeight;
            }

            // ── Mic: Capture PCM16 at 16kHz — streams continuously ──
            let micStream = null;
            let micCtx = null;
            let scriptNode = null;

            function float32ToInt16(float32) {
                const int16 = new Int16Array(float32.length);
                for (let i = 0; i < float32.length; i++) {
                    let s = Math.max(-1, Math.min(1, float32[i]));
                    int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                return int16;
            }

            async function startMicStreaming(ws) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 16000 }
                    });
                    micCtx = new AudioContext({ sampleRate: 16000 });
                    const source = micCtx.createMediaStreamSource(micStream);
                    scriptNode = micCtx.createScriptProcessor(4096, 1, 1);

                    // Stream continuously — echo cancellation handles feedback
                    scriptNode.onaudioprocess = (e) => {
                        if (ws.readyState !== WebSocket.OPEN) return;
                        const float32 = e.inputBuffer.getChannelData(0);
                        ws.send(float32ToInt16(float32).buffer);
                    };

                    source.connect(scriptNode);
                    scriptNode.connect(micCtx.destination);
                    setWave('listening');
                } catch (e) {
                    console.error('Mic error:', e);
                    showToast('Microphone access is required for voice interview', 'error');
                }
            }

            function stopMic() {
                if (scriptNode) { try { scriptNode.disconnect(); } catch (e) { } scriptNode = null; }
                if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
                if (micCtx) { try { micCtx.close(); } catch (e) { } micCtx = null; }
            }

            // ── Status helpers ──
            const setStatus = (msg) => { const el = document.getElementById('viStatus'); if (el) el.textContent = msg; };
            const setWave = (mode) => {
                const w = document.getElementById('viWave'); if (!w) return;
                w.className = 'voice-wave' + (mode === 'listening' ? ' listening' : '');
                w.style.opacity = mode === 'idle' ? '0.3' : '1';
            };

            // ── WebSocket ──
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${location.host}/ws/voice-test?token=${token}&test_id=${testId}`);
            window._viWs = ws;

            ws.onopen = () => {
                setStatus('Connected — starting interview...');
                setWave('idle');
                startMicStreaming(ws);
            };

            ws.onmessage = (evt) => {
                const msg = JSON.parse(evt.data);

                if (msg.type === 'audio') {
                    setWave('speaking'); setStatus('🔊 AI is speaking...');
                    const float32 = b64ToFloat32(msg.data);
                    pcmQueue.push(float32);
                    drainPcmQueue();

                } else if (msg.type === 'interrupted') {
                    stopPlayback();
                    setWave('listening'); setStatus('🎤 Listening...');

                } else if (msg.type === 'transcript') {
                    addMsg(msg.role, msg.text);

                } else if (msg.type === 'turn_complete') {
                    setWave('listening'); setStatus('🎤 Your turn — speak now!');

                } else if (msg.type === 'start_mic') {
                    startMicStreaming(ws);

                } else if (msg.type === 'status') {
                    setStatus(msg.msg);

                } else if (msg.type === 'done') {
                    _viDoneReceived = true;
                    window._viActive = false;
                    window.removeEventListener('beforeunload', beforeUnloadHandler);
                    stopMic();
                    if (window._viEndTimeout) { clearTimeout(window._viEndTimeout); window._viEndTimeout = null; }

                    // Wait for remaining audio to play, then show results
                    const waitForAudio = async () => {
                        const deadline = Date.now() + 10000;
                        while (pcmQueue.length > 0 && Date.now() < deadline) {
                            await new Promise(r => setTimeout(r, 200));
                        }
                        await new Promise(r => setTimeout(r, 1500));
                        stopPlayback();

                        window._activeTest = false;  // Clear BEFORE navigating to prevent double-modal
                        const mappedResults = (msg.results || []).map(r => ({
                            question: r.question || '',
                            answer: r.student_answer || r.answer || 'No answer provided',
                            score: r.score || 0,
                            feedback: r.feedback || '',
                            understanding: r.understanding || 'moderate',
                        }));
                        window._testState.results = mappedResults;
                        window._testState.overall_score = msg.overall_score;
                        window._testState.overall_feedback = msg.overall_feedback;
                        setStatus('✅ Interview complete — calculating results...');
                        finishAITest();
                    };
                    waitForAudio();

                } else if (msg.type === 'error') {
                    showToast(msg.msg || 'Error', 'error');
                    stopMic(); stopPlayback();
                    window._viActive = false;
                    window.removeEventListener('beforeunload', beforeUnloadHandler);
                }
            };

            ws.onclose = () => {
                stopMic();
                if (!_viDoneReceived) { stopPlayback(); window._viActive = false; window.removeEventListener('beforeunload', beforeUnloadHandler); }
            };
            ws.onerror = () => {
                showToast('Connection failed', 'error'); stopMic(); stopPlayback();
                window._viActive = false; window.removeEventListener('beforeunload', beforeUnloadHandler);
            };
        }

        function cleanupVoiceInterview() {
            if (window._viMicStream) { window._viMicStream.getTracks().forEach(t => t.stop()); window._viMicStream = null; }
            if (window._viScriptNode) { try { window._viScriptNode.disconnect(); } catch (e) { } window._viScriptNode = null; }
            if (window._viMicCtx) { try { window._viMicCtx.close(); } catch (e) { } window._viMicCtx = null; }
            window._viActive = false;
            window._viWs = null;
            window.removeEventListener('beforeunload', window._viBeforeUnload);
        }

        window.endVoiceInterview = () => {
            // Now handled by showLeaveInterviewDialog()
            window.showLeaveInterviewDialog && window.showLeaveInterviewDialog();
        };

        // ── TTS via browser SpeechSynthesis (for text mode fallback) ──
        if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); }

        function speakText(text) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) { resolve(); return; }
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.rate = 0.9; utter.pitch = 1.0; utter.volume = 1.0;
                const voices = window.speechSynthesis.getVoices();
                const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Microsoft') || v.name.includes('Natural')))
                    || voices.find(v => v.lang.startsWith('en') && v.localService === false)
                    || voices.find(v => v.lang.startsWith('en'));
                if (preferred) utter.voice = preferred;
                utter.onend = () => resolve();
                utter.onerror = () => resolve();
                window.speechSynthesis.speak(utter);
                window._ttsUtterance = utter;
            });
        }

        async function askNextQuestion() {
            const s = window._testState;
            if (s.currentQ > s.totalQ) { finishAITest(); return; }
            try {
                document.getElementById('aiTestArea').innerHTML = `<div class="empty-state"><p>AI is thinking of question ${s.currentQ}/${s.totalQ}...</p></div>`;
                const data = await apiPost(`/tests/${s.testId}/ask-question`, {
                    question_number: s.currentQ,
                    previous_questions: s.previousQuestions,
                    mode: s.chosenMode,
                });
                const q = data.question;
                s.previousQuestions.push(q);
                renderTextQuestion(q);
            } catch (e) { showToast(e.message, 'error'); }
        }

        // ── Text Mode Question ──
        function renderTextQuestion(q) {
            const s = window._testState;
            document.getElementById('aiTestArea').innerHTML = `
    <div class="card" style="padding:16px;border-left:4px solid var(--primary)">
      <p class="text-sm text-muted mb-1">Question ${s.currentQ} of ${s.totalQ}</p>
      <p class="font-bold mb-3" style="font-size:16px;line-height:1.5">${q}</p>
      <textarea id="aiAnswer" rows="3" style="width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:10px;font-family:var(--font);font-size:14px;resize:vertical" placeholder="Type your answer..."></textarea>
      <button class="btn btn-success mt-2" id="submitAnswerBtn" onclick="submitAIAnswer()">Submit Answer →</button>
    </div>`;
        }

        window.endInterviewEarly = () => {
            if (window._viWs) { endVoiceInterview(); return; }
            if (window._mediaRecorder && window._mediaRecorder.state === 'recording') window._mediaRecorder.stop();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            clearInterval(window._recordTimer);
            finishAITest();
        };

        window.submitAIAnswer = async () => {
            const s = window._testState;
            const answer = document.getElementById('aiAnswer').value.trim();
            if (!answer) { showToast('Please enter an answer', 'error'); return; }
            const btn = document.getElementById('submitAnswerBtn');
            setLoading(btn, true);
            try {
                const q = s.previousQuestions[s.currentQ - 1];
                const evalResult = await apiPost(`/tests/${s.testId}/evaluate-answer`, { question: q, answer });
                const scoreColor = (evalResult.score || 0) >= 70 ? 'var(--accent)' : (evalResult.score || 0) >= 40 ? 'var(--warning)' : 'var(--danger)';
                document.getElementById('aiTestArea').innerHTML = `
    <div class="card" style="padding:16px;border-left:4px solid ${scoreColor}">
      <p class="font-bold">Q${s.currentQ}: ${q}</p>
      <p class="text-sm mt-1">Your answer: ${answer}</p>
      <p class="text-sm mt-1"><strong>Score: ${evalResult.score || 0}%</strong> — ${evalResult.feedback || ''}</p>
      <p class="text-sm mt-1" style="color:var(--accent)">${evalResult.encouragement || ''}</p>

    <h3 style="margin-bottom:12px">Questions & Answers</h3>

            const secId = $('#attSection').value;
            if (!secId) return;
            const days = parseInt(prompt('How many days of history?', '30') || '30');
            if (isNaN(days) || days < 1) return;
            try {
                // Single batch request instead of N
                const result = await apiGet(`/attendance/section/${secId}/history?days=${days}`);
                const history = result.history || [];
                let historyHtml = `<div class="card" style="margin-top:12px"><div class="card-header"><h3>Attendance History (Last ${days} Days)</h3></div>`;
                historyHtml += '<div class="table-wrapper"><table><thead><tr><th>Date</th><th>Present</th><th>Absent</th><th>Total</th><th></th></tr></thead><tbody>';
                if (history.length) {
                    for (const row of history) {
                        historyHtml += `<tr style="cursor:pointer" onclick="expandAttDate('${secId}','${row.date}', this)">
                        <td><strong>${row.date}</strong></td><td style="color:var(--accent)">${row.present}</td><td style="color:var(--danger)">${row.absent}</td><td>${row.total}</td>
                        <td class="text-sm text-muted">▶ Click to expand</td></tr>
                        <tr class="hidden" id="attHist-${row.date}"><td colspan="5" style="padding:0">
                        <div id="attDetail-${row.date}" style="padding:10px;background:var(--gray-50)"><span class="text-sm text-muted">Loading...</span></div>
                        </td></tr>`;
                    }
                } else {
                    historyHtml += '<tr><td colspan="5" class="text-sm text-muted" style="text-align:center">No attendance records found</td></tr>';
                }
                historyHtml += '</tbody></table></div></div>';
                const container = C();
                container.innerHTML += historyHtml;
            } catch (e) { showToast(e.message, 'error'); }
        };
        window.expandAttDate = async (secId, dt, trEl) => {
            const row = document.getElementById(`attHist-${dt}`);
            if (!row) return;
            if (!row.classList.contains('hidden')) { row.classList.add('hidden'); return; }
            row.classList.remove('hidden');
            const detailDiv = document.getElementById(`attDetail-${dt}`);
            if (detailDiv.dataset.loaded) return; // already loaded
            try {
                const data = await apiGet(`/attendance/section/${secId}?att_date=${dt}`);
                const marked = data.filter(s => s.present !== null);
                detailDiv.innerHTML = marked.length ? `<div style="max-height:250px;overflow-y:auto">
                ${marked.map(s => `<div class="flex justify-between" style="padding:3px 8px;border-bottom:1px solid var(--gray-100)">
                <span class="text-sm">${s.student_name}</span>
                <span class="badge-status ${s.present ? 'badge-approved' : 'badge-rejected'}" style="font-size:11px">${s.present ? '✓ Present' : '✗ Absent'}</span></div>`).join('')}
                </div>` : '<span class="text-sm text-muted">No records</span>';
                detailDiv.dataset.loaded = 'true';
            } catch (e) { detailDiv.innerHTML = '<span class="text-sm" style="color:var(--danger)">Failed to load</span>'; }
        };

        // Start
        loadPage('home');
    </script>
</body>

</html>
