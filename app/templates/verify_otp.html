{% extends "base.html" %}

{% block title %}Verify Security — Entorhino{% endblock %}

{% block head %}
<style>
    .verify-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: radial-gradient(circle at center, rgba(168, 85, 247, 0.15), transparent 800px);
    }
    
    .verify-box {
        width: 100%;
        max-width: 420px;
        padding: 48px;
        text-align: center;
    }
    
    .otp-inputs {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 32px;
    }
    
    .otp-input {
        width: 54px;
        height: 64px;
        font-size: 24px;
        font-weight: 800;
        border-radius: 12px;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
    }
</style>
{% endblock %}

{% block content %}
<div class="verify-container">
    <div class="glass-panel verify-box animate-fade-in">
        <h1 class="text-gradient">Verify Securely</h1>
        <p>Enter the 4-digit code sent to your email.</p>
        
        <form id="verify-form">
            <div class="otp-inputs">
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
                <input type="text" class="otp-input" maxlength="1" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
                <span>Verify & Finish</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
